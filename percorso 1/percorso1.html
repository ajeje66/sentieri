<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Mappa + Altimetria Dinamica</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

#map {
  height: 65vh;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#map {
    width: 100%;
    height: 50%;
}

#chart-container {
  height: 35vh;
  padding: 10px 20px;
  background: #fff;
}

canvas {
  width: 100% !important;
  height: 100% !important;
}
#map-hint {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(27, 67, 50, 0.95);
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    text-align: center;
    width: max-content;
    max-width: calc(100% - 30px);
    box-sizing: border-box;
    pointer-events: none;
    transition: opacity 0.25s ease;
}

#map-hint kbd {
    background: white;
    color: #1B4332;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: bold;
}

#map-hint.hidden {
    opacity: 0;
}

.hint-mobile {
    display: none;
}

@media (pointer: coarse) {
    .hint-desktop {
        display: none;
    }

    .hint-mobile {
        display: inline;
    }
}
.leaflet-container{
	touch-action: pan-y;
}

.gps-button {
    background: white;
    color: #1B4332;
    border: 2px solid rgba(0, 0, 0, 0.2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

.gps-button:hover {
    background: #EAF7F1;
}

.gps-button:focus-visible {
    outline: 2px solid #40916C;
    outline-offset: 2px;
}

</style>
</head>

<body>
<div id="map-hint">
    <span class="hint-desktop">
        Tieni premuto <kbd>CTRL</kbd> per zoomare o trascinare
    </span>

    <span class="hint-mobile">
        Usa due dita per spostare e zoomare la mappa
    </span>
</div>
<div id="map"></div>
<div id="chart-container">
  <canvas id="elevationChart"></canvas>
</div>

<script>

let map = L.map('map',{
	minZoom:15,
	maxZoom:18}).setView([40.42, 15.23], 13);

map.scrollWheelZoom.disable();
map.dragging.disable();
map.touchZoom.disable();

const mapHint = document.getElementById("map-hint");

let ctrlPressed = false;

function updateMapInteraction(active) {
    if (active) {
        map.scrollWheelZoom.enable();
		map.dragging.enable();
        mapHint.classList.add("hidden");
    } else {
        map.scrollWheelZoom.disable();
		map.dragging.disable();
        mapHint.classList.remove("hidden");
    }
}

window.addEventListener("keydown", function (e) {
    if (e.key === "Control") {
        ctrlPressed = true;
        updateMapInteraction(true);
    }
});

window.addEventListener("keyup", function (e) {
    if (e.key === "Control") {
        ctrlPressed = false;
        updateMapInteraction(false);
    }
});

window.addEventListener("blur", function () {
    ctrlPressed = false;
    updateMapInteraction(false);
});

// Controlla CTRL anche quando si usa la rotella
map.getContainer().addEventListener("wheel", function (e) {
    if (e.ctrlKey) {
        updateMapInteraction(true);
    } else {
        updateMapInteraction(false);
    }
}, { passive: true });

updateMapInteraction(false);

// Gestione touch su mobile
const mapElement = map.getContainer();

function isMobileDevice() {
    return window.matchMedia("(pointer: coarse)").matches;
}

function updateTouchInteraction() {
    if (isMobileDevice()) {
        // Un dito non deve trascinare la mappa
        map.dragging.disable();

        // Consente lo zoom tramite due dita
        map.touchZoom.enable();
    }
}

updateTouchInteraction();
window.addEventListener("resize", updateTouchInteraction);

const bounds = [
  [40.406862, 15.200811], // Sud-Ovest
  [40.437017, 15.264628]  // Nord-Est
];

map.setMaxBounds(bounds);
map.on('drag', function() {
  map.panInsideBounds(bounds, { animate: false });
});

const satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
);

const osm = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
);


satellite.addTo(map);

L.control.layers({
  "Satellite": satellite,
  "OpenStreetMap": osm  
}).addTo(map);

let chart;
let marker;
let allPoints = [];
let latlngs = [];

// ==========================
// CARICAMENTO TRACCIATO
// ==========================
fetch('percorso1.geojson')
  .then(res => res.json())
  .then(data => {

    data.features.forEach(f => {
      f.geometry.coordinates.forEach(line => {
        line.forEach(p => {
          latlngs.push([p[1], p[0]]);
          allPoints.push({
            latlng: [p[1], p[0]],
            ele: p[2] || 0
          });
        });
      });
    });

    allPoints = allPoints.map((p, i) => ({
      ...p,
      index: i
    }));

    let polyline = L.polyline(latlngs, {
      color: "#cc0000",
      weight: 4
    }).addTo(map);

    map.fitBounds(polyline.getBounds());
	
	// ==========================
// DISTANZA PROGRESSIVA
// ==========================
	let distances = [0];
	
	for (let i = 1; i < allPoints.length; i++) {
		let d = map.distance(
			allPoints[i - 1].latlng,
			allPoints[i].latlng
		);
		
		distances.push(distances[i - 1] + d);
	}

    const elevations = allPoints.map(p => p.ele);

    const ctx = document.getElementById('elevationChart');

    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: distances.map(d => Math.round(d / 10) * 10),
        datasets: [{
          label: 'Altitudine',
          data: elevations,
          borderColor: '#2b7cff',
          backgroundColor: 'rgba(43,124,255,0.15)',
          fill: true,
          tension: 0.35,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,

        interaction: {
          mode: 'index',
          intersect: false
        },

        plugins: {
          legend: {
            display: false
          }
        },

        scales: {
          x: {
            display: true,
			title:{
				display: true,
				text: "Distanza(m)"
			}
          }
        },

        onHover: (event, elements) => {

          if (!elements.length) return;

          let index = elements[0].index;
          let point = allPoints[index];

          if (marker) {
            map.removeLayer(marker);
          }

          marker = L.circleMarker(point.latlng, {
            radius: 7,
            color: "#00ecff",
            fillColor: "#00ecff",
            fillOpacity: 1
          }).addTo(map);

          map.panTo(point.latlng);
        }
      }
    });

    polyline.on("mousemove", function(e) {

      let minDist = Infinity;
      let closestIndex = 0;

      allPoints.forEach((p, i) => {

        let d = map.distance(
          e.latlng,
          L.latLng(p.latlng[0], p.latlng[1])
        );

        if (d < minDist) {
          minDist = d;
          closestIndex = i;
        }
      });

      chart.setActiveElements([
        {
          datasetIndex: 0,
          index: closestIndex
        }
      ]);

      chart.tooltip.setActiveElements([
        {
          datasetIndex: 0,
          index: closestIndex
        }
      ]);

      chart.update('none');

      if (marker) {
        map.removeLayer(marker);
      }

      marker = L.circleMarker(
        allPoints[closestIndex].latlng,
        {
          radius: 7,
          color: "#00ecff",
          fillColor: "#00ecff",
          fillOpacity: 1
        }
      ).addTo(map);
    });

  })
  .catch(err => console.error("Errore test.geojson:", err));


// ==========================
// CARICAMENTO PUNTI INTERESSE
// ==========================
/*
const icons = {
  chiesa: L.icon({
    iconUrl: 'assets/church.svg',
    iconSize: [25,25]
  }),
  museo: L.icon({
    iconUrl: 'assets/museum.svg',
    iconSize: [25,25]
  }),
  murales: L.icon({
    iconUrl: 'assets/painting.svg',
    iconSize: [25,25]
  }),
  mulino: L.icon({
    iconUrl: 'assets/watermill.svg',
    iconSize: [25,25]
  }),
  fontana: L.icon({
    iconUrl: 'assets/faucet.svg',
    iconSize: [25,25]
  }),
};*/

let poiLayer;

function getIcon(tipo) {

  let size;

  const zoom = map.getZoom();

  if (zoom <= 15) {
    size = 16;
  } else if (zoom <= 16) {
    size = 24;
  } else {
    size = 32;
  }

  const urls = {
    chiesa: 'assets/church.svg',
    mulino: 'assets/watermill.svg',
    museo: 'assets/museum.svg',
    murales: 'assets/painting.svg',
	fontana: 'assets/faucet.svg',
	ponte: 'assets/bridge.svg',
	panorama: 'assets/point.svg',
	fiume: 'assets/wave.svg'
  };

  return L.icon({
    iconUrl: urls[tipo],
    iconSize: [size, size],
    iconAnchor: [size / 2, size],
    popupAnchor: [0, -size]
  });

}

fetch('punti1.geojson')
  .then(res => res.json())
  .then(data => {

    poiLayer = L.geoJSON(data, {

      pointToLayer: function(feature, latlng) {

        const tipo = feature.properties.tipo;

        return L.marker(latlng, {
          icon: getIcon(tipo)
        });

      },

      onEachFeature: function(feature, layer) {

        const nome = feature.properties.nome || "Punto";
        const descrizione = feature.properties.descrizione || "";

        layer.bindPopup(`
          <h3>${nome}</h3>
          <p>${descrizione}</p>
        `);

      }

    });
	poiLayer.addTo(map);

    // Mostra i POI solo se lo zoom è sufficientemente alto
    /*if (map.getZoom() >= 16) {
      poiLayer.addTo(map);
    }*/

  });
map.on('zoomend', function() {

  if (!poiLayer) return;

  poiLayer.eachLayer(function(layer) {

    const tipo = layer.feature.properties.tipo;

    layer.setIcon(
      getIcon(tipo)
    );

  });

});

let gpsMarker = null;
let gpsAccuracy = null;
let gpsWatchId = null;
let firstGpsFix = true;

// Crea un pulsante nei controlli della mappa
const gpsControl = L.control({ position: "topleft" });

gpsControl.onAdd = function () {
    const button = L.DomUtil.create("button", "gps-button");
    button.type = "button";
    button.textContent = "📍";
    button.title = "Attiva o disattiva la posizione GPS";
    button.setAttribute("aria-label", "Attiva o disattiva il GPS");

    L.DomEvent.disableClickPropagation(button);

    L.DomEvent.on(button, "click", function () {
        if (gpsWatchId !== null) {
            navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = null;
            button.textContent = "📍";
            return;
        }

        if (!("geolocation" in navigator)) {
            alert("Il tuo browser non supporta la geolocalizzazione.");
            return;
        }

        button.textContent = "⏳ Ricerca GPS...";

        gpsWatchId = navigator.geolocation.watchPosition(
            function (position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;
                const pos = [lat, lng];

                if (!gpsMarker) {
                    gpsMarker = L.marker(pos)
                        .addTo(map)
                        .bindPopup("📍 Ti trovi qui");
                } else {
                    gpsMarker.setLatLng(pos);
                }

                if (!gpsAccuracy) {
                    gpsAccuracy = L.circle(pos, {
                        radius: accuracy,
                        color: "#2D6A4F",
                        fillColor: "#40916C",
                        fillOpacity: 0.15,
                        weight: 2
                    }).addTo(map);
                } else {
                    gpsAccuracy.setLatLng(pos);
                    gpsAccuracy.setRadius(accuracy);
                }

                // Centra la mappa soltanto al primo rilevamento
                if (firstGpsFix) {
                    map.setView(pos, 16);
                    firstGpsFix = false;
                }

                button.textContent = "📍 GPS attivo · Disattiva";
            },
            function (error) {
                const messages = {
                    1: "Devi autorizzare l'accesso alla posizione.",
                    2: "Posizione GPS non disponibile.",
                    3: "Tempo scaduto durante la ricerca GPS."
                };

                alert(messages[error.code] || "Errore nel rilevamento GPS.");

                if (gpsWatchId !== null) {
                    navigator.geolocation.clearWatch(gpsWatchId);
                    gpsWatchId = null;
                }

                button.textContent = "📍 ";
            },
            {
                enableHighAccuracy: true,
                maximumAge: 5000,
                timeout: 20000
            }
        );
    });

    return button;
};

gpsControl.addTo(map);

</script>

</body>
</html>
